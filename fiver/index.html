<style>
:root{--bg:#f3ead8;--card:#fbf6ea;--ink:#1f1b16;--muted:#6b5f50;--accent:#d9582b;--yes:#5f9e4c;--no:#d9452b;--hit:#5f9e4c;--near:#e8b04b;--miss:#8a7f71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(rgba(31,27,22,.05) 1px,transparent 1px);background-size:6px 6px}
.stripe{flex:none;height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,#e8b04b 22px 44px,#7fb6a8 44px 66px,#a7c4e2 66px 88px)}
.app{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;gap:9px;
  padding:10px max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-right))}
.app>*{flex:none}
header.top{display:flex;align-items:center;gap:10px;text-align:center;padding:0 4px}
header.top .ttl{flex:1;min-width:0}
header.top h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(24px,7.6vw,38px);letter-spacing:.04em;margin:0;line-height:1;white-space:nowrap}
header.top .tag{font-size:13px;margin:2px 0 0;color:var(--muted);font-style:italic}
@media (max-height:760px){header.top .tag{display:none}}
.home,.info{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);
  box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:inherit;font-weight:700;
  font-size:19px;line-height:1;color:var(--ink);text-decoration:none;padding:0;margin:0;cursor:pointer}
.home:active,.info:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.modes{display:flex;justify-content:center;gap:clamp(3px,1.2vw,6px);flex-wrap:nowrap}
.pill{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;
  padding:5px clamp(7px,2.5vw,12px);font-size:clamp(12.5px,3.7vw,14px);white-space:nowrap;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stage{flex:1 1 auto!important;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.tool{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;
  padding:10px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.tool.primary{background:var(--ink);color:var(--card)}
.tool:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(31,27,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.hidden{display:none}
.card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:22px 18px 18px;max-width:380px;width:100%;
  text-align:center;box-shadow:8px 8px 0 var(--ink);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-size:24px;letter-spacing:.03em}
.card p{margin:12px 0 0;line-height:1.45}
.card .stats{font-weight:700;font-size:18px}
.card .btns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.card .btns .tool{padding:10px 16px}
.stamp{display:inline-block;font-family:"Archivo Black",Impact,sans-serif;font-size:32px;color:var(--accent);
  border:4px double var(--accent);padding:6px 14px;border-radius:8px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
.stamp.good{color:var(--yes);border-color:var(--yes)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.mbody{text-align:left}
.mbody h3{margin:0 0 4px;font-size:16px}
.mbody ul{padding-left:18px;margin:0 0 14px;line-height:1.45}
.mbody .rec{margin:0 0 12px;font-weight:700}

/* ===== Fiver ===== */
#rows{display:grid;grid-template-rows:repeat(6,var(--ts));gap:var(--g)}
.wr{display:grid;grid-template-columns:repeat(5,var(--ts));gap:var(--g)}
.wr.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.t{border:3px solid rgba(31,27,22,.25);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;
  font-family:"Archivo Black",Impact,sans-serif;font-size:calc(var(--ts)*.5);text-transform:uppercase;line-height:1}
.t.filled{border-color:var(--ink);animation:tpop .1s ease-out}
@keyframes tpop{50%{transform:scale(1.1)}}
.t.hit,.t.near,.t.miss{border-color:var(--ink);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.t.hit{background:var(--hit)}.t.near{background:var(--near);color:var(--ink)}.t.miss{background:var(--miss)}
.t.flip{animation:flip .5s ease-in-out both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.t.hop{animation:hop .5s ease-out both}
@keyframes hop{40%{transform:translateY(-22%)}}
.kb{display:flex;flex-direction:column;gap:6px;touch-action:manipulation}
.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:clamp(44px,6.6dvh,56px);border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);
  font:inherit;font-weight:700;font-size:clamp(14px,4.4vw,18px);text-transform:uppercase;cursor:pointer;padding:0;box-shadow:0 2px 0 var(--ink)}
.key.wide{max-width:66px;flex:1.5;font-size:12px;letter-spacing:.06em}
.key:active{transform:translateY(2px);box-shadow:none}
.key.hit{background:var(--hit);color:#fff}.key.near{background:var(--near)}.key.miss{background:var(--miss);color:#fff;border-color:var(--miss)}
.toast{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);font-weight:700;padding:8px 14px;border-radius:10px;
  z-index:5;pointer-events:none;animation:toast 1.6s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-6px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.dist{margin:14px 0 0;text-align:left}
.dist .dr{display:flex;align-items:center;gap:6px;margin:3px 0;font-weight:700;font-size:13px}
.dist .bar{background:var(--miss);color:#fff;border-radius:4px;padding:1px 6px;min-width:22px;text-align:right}
.dist .bar.me{background:var(--hit)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.sgrid b{display:block;font-family:"Archivo Black",Impact,sans-serif;font-size:24px}
.sgrid span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
</style>

<template id="howto"><ul>
  <li>Guess the hidden <b>five-letter word</b> in six tries. Each guess has to be a real word.</li>
  <li><b style="color:var(--hit)">Green</b>: right letter, right spot. <b style="color:#b07d16">Yellow</b>: in the word, wrong spot. <b style="color:var(--miss)">Grey</b>: not in the word.</li>
  <li>The keyboard keeps track of what you've learned.</li>
  <li>The <b>Daily</b> word is the same for everyone and changes at midnight. <b>Practice</b> gives you as many extra words as you like.</li>
</ul>

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showOverlay(html){$('#card').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hideOverlay(){$('#overlay').classList.add('hidden')}
function recordLine(){return typeof RECORD_LINE==='function'?RECORD_LINE():''}
$('#infoBtn').onclick=()=>{
  const rec=recordLine();
  showOverlay(`<div class="mbody">${rec?`<p class="rec">${rec}</p>`:''}<h3>How to play</h3>${$('#howto').innerHTML}</div>
    <div class="btns"><button class="tool" id="infoClose">Got it</button></div>`);
  $('#infoClose').onclick=hideOverlay;
};

const VALID=new Set();for(let i=0;i<GUESS_BLOB.length;i+=5)VALID.add(GUESS_BLOB.slice(i,i+5));for(const a of ANSWERS)VALID.add(a);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ORDER=(()=>{const o=ANSWERS.slice(),r=mulberry(20260101);for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o})();
const d0=new Date(),today=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0');
const dayNum=Math.round((new Date(d0.getFullYear(),d0.getMonth(),d0.getDate())-new Date(2026,0,1))/864e5);
const dailyWord=ORDER[((dayNum%ORDER.length)+ORDER.length)%ORDER.length];
const STATS=store.get('fv-stats',{played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0],last:null});
const RECORD_LINE=()=>`Daily: ${STATS.wins}/${STATS.played} solved · streak ${STATS.streak} (best ${STATS.max})`;
let MODE=store.get('fv-mode','daily');if(!['daily','practice'].includes(MODE))MODE='daily';
let G=null,busy=false;

function score(guess,ans){
  const res=new Array(5).fill('miss'),left={};
  for(let i=0;i<5;i++){if(guess[i]===ans[i])res[i]='hit';else left[ans[i]]=(left[ans[i]]||0)+1}
  for(let i=0;i<5;i++)if(res[i]!=='hit'&&left[guess[i]]){res[i]='near';left[guess[i]]--}
  return res;
}
function build(){
  const rows=$('#rows');rows.innerHTML='';
  for(let r=0;r<6;r++){const row=document.createElement('div');row.className='wr';for(let c=0;c<5;c++){const t=document.createElement('div');t.className='t';row.appendChild(t)}rows.appendChild(row)}
  const kb=$('#kb');kb.innerHTML='';
  ['qwertyuiop','asdfghjkl','>zxcvbnm<'].forEach(line=>{const r=document.createElement('div');r.className='kr';
    for(const ch of line){const b=document.createElement('button');b.className='key'+(ch==='>'||ch==='<'?' wide':'');b.dataset.k=ch==='>'?'enter':ch==='<'?'back':ch;
      b.textContent=ch==='>'?'ENTER':ch==='<'?'⌫':ch;r.appendChild(b)}kb.appendChild(r)});
}
function start(mode){
  hideOverlay();MODE=mode;store.set('fv-mode',mode);
  document.querySelectorAll('.pill[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  if(mode==='daily'){const s=store.get('fv-daily',null);G=s&&s.date===today?s:{date:today,answer:dailyWord,guesses:[],done:false,won:false}}
  else{const s=store.get('fv-practice',null);G=s&&!s.done?s:{answer:ANSWERS[Math.floor(Math.random()*ANSWERS.length)],guesses:[],done:false,won:false}}
  G.cur='';build();fit();paint();
  if(G.done)setTimeout(()=>result(false),300);
}
function save(){const {cur,...rest}=G;store.set(MODE==='daily'?'fv-daily':'fv-practice',rest)}
function paint(){
  const rows=$('#rows').children,kstate={};
  G.guesses.forEach((g,r)=>{const sc=score(g,G.answer);[...g].forEach((ch,c)=>{const t=rows[r].children[c];t.textContent=ch;t.className='t '+sc[c];
    const rank={hit:3,near:2,miss:1};if(!kstate[ch]||rank[sc[c]]>rank[kstate[ch]])kstate[ch]=sc[c]})});
  const r=G.guesses.length;
  if(r<6&&!G.done)[...rows[r].children].forEach((t,c)=>{const ch=G.cur[c]||'';if(t.textContent!==ch){t.textContent=ch;t.className='t'+(ch?' filled':'')}});
  for(let k=G.guesses.length+(G.done?0:1);k<6;k++)[...rows[k].children].forEach(t=>{t.textContent='';t.className='t'});
  document.querySelectorAll('.key').forEach(b=>{const s=kstate[b.dataset.k];b.className='key'+(b.dataset.k.length>1?' wide':'')+(s?' '+s:'')});
}
function fit(){
  const st=$('#stage'),g=6,ts=Math.floor(Math.min((st.clientWidth-4*g-8)/5,(st.clientHeight-5*g-8)/6,66));
  $('#rows').style.setProperty('--ts',ts+'px');$('#rows').style.setProperty('--g',g+'px');
}
addEventListener('resize',fit);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#stage').appendChild(d);setTimeout(()=>d.remove(),1600)}
async function press(k){
  if(!G||G.done||busy||!$('#overlay').classList.contains('hidden'))return;
  if(k==='back'){G.cur=G.cur.slice(0,-1);paint();return}
  if(k==='enter'){submit();return}
  if(/^[a-z]$/.test(k)&&G.cur.length<5){G.cur+=k;paint()}
}
async function submit(){
  const row=$('#rows').children[G.guesses.length];
  if(G.cur.length<5||!VALID.has(G.cur)){toast(G.cur.length<5?'Not enough letters':'Not in the word list');row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');if(navigator.vibrate)navigator.vibrate(40);return}
  busy=true;const guess=G.cur,sc=score(guess,G.answer);
  const tiles=[...row.children];
  for(let c=0;c<5;c++){const t=tiles[c];t.classList.add('flip');t.style.animationDelay=c*.18+'s';setTimeout(()=>{t.className='t flip '+sc[c]},c*180+250)}
  await sleep(4*180+520);
  tiles.forEach(t=>{t.classList.remove('flip');t.style.animationDelay=''});
  G.guesses.push(guess);G.cur='';
  const won=guess===G.answer;
  if(won||G.guesses.length===6){G.done=true;G.won=won;
    if(won)tiles.forEach((t,c)=>{t.classList.add('hop');t.style.animationDelay=c*.09+'s'});
    if(MODE==='daily'&&STATS.last!==today){STATS.played++;STATS.last=today;if(won){STATS.wins++;STATS.dist[G.guesses.length-1]++;STATS.streak++;STATS.max=Math.max(STATS.max,STATS.streak)}else STATS.streak=0;store.set('fv-stats',STATS)}
    if(MODE==='daily')store.set('fv-daily-done',today);
  }
  save();paint();busy=false;
  if(G.done){if(!won)toast(G.answer.toUpperCase());setTimeout(()=>result(true),won?1300:1700)}
}
function statsHTML(){
  const mx=Math.max(1,...STATS.dist);
  return `<div class="sgrid"><div><b>${STATS.played}</b><span>Played</span></div><div><b>${STATS.played?Math.round(STATS.wins/STATS.played*100):0}</b><span>Win %</span></div>
    <div><b>${STATS.streak}</b><span>Streak</span></div><div><b>${STATS.max}</b><span>Best</span></div></div>
    <div class="dist">${STATS.dist.map((n,i)=>`<div class="dr">${i+1}<span class="bar ${MODE==='daily'&&G?.won&&G.guesses.length===i+1?'me':''}" style="width:${8+n/mx*80}%">${n}</span></div>`).join('')}</div>`;
}
function shareText(){
  const sc=G.guesses.map(g=>score(g,G.answer).map(s=>s==='hit'?'🟩':s==='near'?'🟨':'⬜').join('')).join('\n');
  return `Fiver ${MODE==='daily'?'#'+(dayNum+1):'practice'} ${G.won?G.guesses.length:'X'}/6\n${sc}`;
}
function result(fresh){
  const won=G.won;
  showOverlay(`<div class="stamp ${won?'good':''}">${won?['GENIUS','BRILLIANT','SHARP','NICE','PHEW','CLUTCH'][G.guesses.length-1]:'OUT OF TRIES'}</div>
    <p class="stats">The word was ${G.answer.toUpperCase()}</p>
    ${MODE==='daily'?statsHTML()+'<p>New word at midnight.</p>':''}
    <div class="btns"><button class="tool" id="share">Share</button>${MODE==='daily'?'<button class="tool" id="closeO">Close</button><button class="tool primary" id="prac">Practice</button>':'<button class="tool" id="closeO">Close</button><button class="tool primary" id="next">Next word</button>'}</div>`);
  $('#closeO').onclick=hideOverlay;
  const p=$('#prac');if(p)p.onclick=()=>start('practice');const n=$('#next');if(n)n.onclick=()=>{store.set('fv-practice',null);start('practice')};
  $('#share').onclick=async()=>{const t=shareText();
    try{if(navigator.share&&matchMedia('(pointer:coarse)').matches)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$('#share').textContent='Copied!'}}catch(e){}};
}
$('#kb').addEventListener('pointerdown',e=>{const b=e.target.closest('.key');if(!b)return;e.preventDefault();press(b.dataset.k)});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey)return;const k=e.key==='Enter'?'enter':e.key==='Backspace'?'back':e.key.toLowerCase();if(k==='enter'||k==='back'||/^[a-z]$/.test(k)){e.preventDefault();press(k)}});
document.querySelectorAll('.pill[data-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.mode===MODE&&!G.done)return;start(b.dataset.mode)});
$('#statsBtn').onclick=()=>{showOverlay(`<h2>Daily stats</h2>${statsHTML()}<div class="btns"><button class="tool" id="closeO">Close</button></div>`);$('#closeO').onclick=hideOverlay};
start(MODE);
</script>
