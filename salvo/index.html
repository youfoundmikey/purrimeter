<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arkade">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Salvo · Arkade</title>
<meta name="description" content="Sink the bot's fleet before it sinks yours.">
<meta name="theme-color" content="#f3ead8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%238fb3dc'/%3E%3Crect x='7' y='16' width='26' height='9' rx='4.5' fill='%231f1b16'/%3E%3Ccircle cx='27' cy='20.5' r='3' fill='%23d9452b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--card:#fbf6ea;--ink:#1f1b16;--muted:#6b5f50;--accent:#d9582b;--yes:#5f9e4c;--no:#d9452b;--sea:#a7c4e2;--sea2:#94b6d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(rgba(31,27,22,.05) 1px,transparent 1px);background-size:6px 6px}
.stripe{flex:none;height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,#e8b04b 22px 44px,#7fb6a8 44px 66px,#a7c4e2 66px 88px)}
.app{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;gap:9px;
  padding:10px max(14px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
.app>*{flex:none}
header.top{display:flex;align-items:center;gap:10px;text-align:center}
header.top .ttl{flex:1;min-width:0}
header.top h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(24px,7.6vw,38px);letter-spacing:.04em;margin:0;line-height:1;white-space:nowrap}
header.top .tag{font-size:13px;margin:2px 0 0;color:var(--muted);font-style:italic}
@media (max-height:760px){header.top .tag{display:none}}
.home,.info{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);
  box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:inherit;font-weight:700;
  font-size:19px;line-height:1;color:var(--ink);text-decoration:none;padding:0;margin:0;cursor:pointer}
.home:active,.info:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.modes{display:flex;justify-content:center;gap:clamp(3px,1.2vw,6px);flex-wrap:nowrap}
.pill{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;
  padding:5px clamp(7px,2.5vw,12px);font-size:clamp(12.5px,3.7vw,14px);white-space:nowrap;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stage{flex:1 1 auto!important;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.tools{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.tool{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;
  padding:10px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.tool.primary{background:var(--ink);color:var(--card)}
.tool:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tool:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(31,27,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.hidden{display:none}
.card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:22px 18px 18px;max-width:380px;width:100%;
  text-align:center;box-shadow:8px 8px 0 var(--ink);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-size:24px;letter-spacing:.03em}
.card p{margin:12px 0 0;line-height:1.45}
.card .stats{font-weight:700;font-size:18px}
.card .btns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.card .btns .tool{padding:10px 16px}
.stamp{display:inline-block;font-family:"Archivo Black",Impact,sans-serif;font-size:32px;color:var(--accent);
  border:4px double var(--accent);padding:6px 14px;border-radius:8px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
.stamp.good{color:var(--yes);border-color:var(--yes)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.mbody{text-align:left}
.mbody h3{margin:0 0 4px;font-size:16px}
.mbody ul{padding-left:18px;margin:0 0 14px;line-height:1.45}
.mbody .rec{margin:0 0 12px;font-weight:700}

/* ===== Salvo ===== */
.msg{margin:0;text-align:center;font-weight:700;font-size:15px;min-height:1.3em}
.row{display:flex;gap:12px;align-items:center;justify-content:center;width:100%}
.bw{display:flex;flex-direction:column;gap:4px;align-items:center}
.bw .cap{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:2px;padding:3px;background:var(--ink);
  border-radius:9px;box-shadow:4px 4px 0 var(--ink);touch-action:manipulation}
.bc{background:var(--sea);position:relative;display:flex;align-items:center;justify-content:center;border-radius:2px}
.bc[data-a="1"]{background:var(--sea2)}
#enemy .bc{cursor:crosshair}
#enemy.armed .bc:not(.shot):active{background:#e8b04b}
.bc.ship{background:#5b534a}
.bc.ship.sunk{background:#2e2924}
.bc.ship.hs{border-radius:50% 3px 3px 50%}.bc.ship.he{border-radius:3px 50% 50% 3px}
.bc.ship.vs{border-radius:50% 50% 3px 3px}.bc.ship.ve{border-radius:3px 3px 50% 50%}
.bc.aim{background:#f6dca0!important}
.bc .m{width:28%;height:28%;border-radius:50%;background:#fbf6ea;opacity:.9;animation:plop .25s ease-out}
.bc .h{width:62%;height:62%;border-radius:50%;background:var(--no);box-shadow:0 0 0 2px var(--ink);animation:boom .35s cubic-bezier(.3,1.6,.5,1)}
.bc.sunk .h{background:#8a2c2c}
.bc.last{outline:3px solid #e8b04b;outline-offset:-2px;z-index:1}
@keyframes plop{from{transform:scale(2.2);opacity:0}}
@keyframes boom{from{transform:scale(0)}}
.fleet{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fleet .f{display:flex;align-items:center;gap:6px}
.fleet .pips{display:flex;gap:2px}
.fleet .pips i{width:9px;height:9px;border-radius:2px;background:#5b534a}
.fleet .f.gone{opacity:.35;text-decoration:line-through}
.fleet .f.gone .pips i{background:var(--no)}
</style>
</head>
<body>
<div class="stripe"></div>
<main class="app">
  <header class="top"><a class="home" href="../" aria-label="Back to Arkade">&larr;</a><div class="ttl"><h1>SALVO</h1><p class="tag">find them before they find you.</p></div><button class="info" id="infoBtn" aria-label="How to play">?</button></header>
  <nav class="modes" aria-label="Bot difficulty">
    <button class="pill" data-bot="easy">Easy bot</button>
    <button class="pill" data-bot="hard">Hard bot</button>
  </nav>
  <p class="msg" id="msg"></p>
  <div class="stage" id="stage">
    <div class="row" id="topRow">
      <div class="bw"><span class="cap" id="mineCap">Your fleet</span><div class="board" id="mine"></div></div>
      <div class="fleet" id="fleet"></div>
    </div>
    <div class="bw" id="enemyWrap"><span class="cap">Enemy waters · tap to fire</span><div class="board" id="enemy"></div></div>
  </div>
  <section class="tools" id="tools"></section>
</main>
<template id="howto"><ul>
  <li>You and the bot each hide 5 ships: lengths <b>5, 4, 3, 3 and 2</b>. Ships never touch, not even at the corners.</li>
  <li>Before the battle, tap <b>Shuffle</b> until you like your layout, then <b>Start</b>.</li>
  <li>Take turns firing. <b>Tap a square</b> on the enemy board: white dot is a miss, red is a hit.</li>
  <li>When a ship sinks, the squares around it are marked for you, since nothing can be there.</li>
  <li>Sink all five enemy ships first to win. The small board shows where the bot has fired at you.</li>
</ul>
</template>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showOverlay(html){$('#card').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hideOverlay(){$('#overlay').classList.add('hidden')}
function recordLine(){return typeof RECORD_LINE==='function'?RECORD_LINE():''}
$('#infoBtn').onclick=()=>{
  const rec=recordLine();
  showOverlay(`<div class="mbody">${rec?`<p class="rec">${rec}</p>`:''}<h3>How to play</h3>${$('#howto').innerHTML}</div>
    <div class="btns"><button class="tool" id="infoClose">Got it</button></div>`);
  $('#infoClose').onclick=hideOverlay;
};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.overlay .card'))e.preventDefault()},{passive:false});

//#ENGINE
const N=10,FLEET=[['Carrier',5],['Battleship',4],['Cruiser',3],['Submarine',3],['Destroyer',2]];
const around=i=>{const r=Math.floor(i/N),c=i%N,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const R=r+dr,C=c+dc;if(R>=0&&R<N&&C>=0&&C<N)o.push(R*N+C)}return o};
function placeFleet(){
  for(let attempt=0;attempt<500;attempt++){
    const block=new Uint8Array(N*N),ships=[];let ok=true;
    for(const [name,len] of FLEET){
      const opts=[];
      for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const h of [0,1]){
        if(h&&c+len>N||!h&&r+len>N)continue;
        const cells=[...Array(len)].map((_,k)=>h?r*N+c+k:(r+k)*N+c);
        if(cells.every(i=>!block[i]))opts.push(cells);
      }
      if(!opts.length){ok=false;break}
      const cells=opts[Math.floor(Math.random()*opts.length)];
      for(const i of cells){block[i]=1;for(const j of around(i))block[j]=1}
      ships.push({name,len,cells,hits:0});
    }
    if(ok)return ships;
  }
}
// side: {ships, shots:Uint8Array (0 unknown, 1 miss, 2 hit)}
function fire(side,i){
  if(side.shots[i])return null;
  const ship=side.ships.find(s=>s.cells.includes(i));
  if(!ship){side.shots[i]=1;return {hit:false}}
  side.shots[i]=2;ship.hits++;
  let sunk=null;
  if(ship.hits===ship.len){sunk=ship;for(const c of ship.cells)for(const j of around(c))if(!side.shots[j])side.shots[j]=1}
  return {hit:true,sunk};
}
// ---------- bot targeting ----------
function heat(side){
  const sunkCells=new Set(side.ships.filter(s=>s.hits===s.len).flatMap(s=>s.cells));
  const open=side.ships.filter(s=>s.hits<s.len).map(s=>s.len);
  const hits=[];for(let i=0;i<N*N;i++)if(side.shots[i]===2&&!sunkCells.has(i))hits.push(i);
  const h=new Float64Array(N*N);
  for(const len of open)for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const hz of [0,1]){
    if(hz&&c+len>N||!hz&&r+len>N)continue;
    let ok=true,cover=0;const cells=[];
    for(let k=0;k<len;k++){const i=hz?r*N+c+k:(r+k)*N+c;if(side.shots[i]===1||sunkCells.has(i)){ok=false;break}if(side.shots[i]===2)cover++;cells.push(i)}
    if(!ok)continue;
    if(hits.length&&!cover)continue;             // while a ship is wounded, only chase it
    const w=cover?Math.pow(20,cover):1;
    for(const i of cells)if(!side.shots[i])h[i]+=w;
  }
  return h;
}
function botPick(side,level){
  const unknown=[];for(let i=0;i<N*N;i++)if(!side.shots[i])unknown.push(i);
  const sunkCells=new Set(side.ships.filter(s=>s.hits===s.len).flatMap(s=>s.cells));
  const wounded=[];for(let i=0;i<N*N;i++)if(side.shots[i]===2&&!sunkCells.has(i))wounded.push(i);
  if(level==='easy'){
    if(wounded.length&&Math.random()<.75){ // poke around a hit, a bit clumsily
      const nb=[];for(const i of wounded){const r=Math.floor(i/N),c=i%N;for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){const R=r+dr,C=c+dc;if(R>=0&&R<N&&C>=0&&C<N&&!side.shots[R*N+C])nb.push(R*N+C)}}
      if(nb.length)return nb[Math.floor(Math.random()*nb.length)];
    }
    return unknown[Math.floor(Math.random()*unknown.length)];
  }
  const h=heat(side);let best=-1,top=[];
  for(const i of unknown){if(h[i]>best){best=h[i];top=[i]}else if(h[i]===best)top.push(i)}
  return top[Math.floor(Math.random()*top.length)];
}
//#END

let BOT=store.get('sv-bot','easy');if(!['easy','hard'].includes(BOT))BOT='easy';
const REC=store.get('sv-record',{});
const RECORD_LINE=()=>`Vs Easy: ${REC.easyW||0}–${REC.easyL||0} · Vs Hard: ${REC.hardW||0}–${REC.hardL||0}`;
let G=null;
const mineEl=$('#mine'),enemyEl=$('#enemy');
for(const b of [mineEl,enemyEl])for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='bc';d.dataset.i=i;d.dataset.a=(Math.floor(i/N)+i)%2;b.appendChild(d)}
const cellsOf=b=>b.children;

function newGame(){
  hideOverlay();
  G={id:(G?.id||0)+1,phase:'setup',me:{ships:placeFleet(),shots:new Uint8Array(N*N)},bot:{ships:placeFleet(),shots:new Uint8Array(N*N)},busy:false,myShots:0};
  document.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.bot===BOT));
  $('#msg').textContent='Place your fleet: shuffle, then start.';
  tools();paint();fit();
}
function tools(){
  const t=$('#tools');
  if(G.phase==='setup'){t.innerHTML='<button class="tool" id="shuffle">Shuffle</button><button class="tool primary" id="start">Start battle</button>';
    $('#shuffle').onclick=()=>{G.me.ships=placeFleet();paint()};$('#start').onclick=start}
  else{t.innerHTML='<button class="tool" id="newBtn">New game</button>';$('#newBtn').onclick=askNew}
}
function start(){G.phase='battle';tools();fit();$('#msg').textContent='Your shot. Tap the enemy board.';paint()}
function paintBoard(el,side,showShips,last){
  const cs=cellsOf(el),sunk=new Set(side.ships.filter(s=>s.hits===s.len).flatMap(s=>s.cells)),own=new Set(side.ships.flatMap(s=>s.cells));
  const end={};for(const sh of side.ships){const h=sh.cells[1]-sh.cells[0]===1;end[sh.cells[0]]=h?' hs':' vs';end[sh.cells[sh.len-1]]=h?' he':' ve'}
  for(let i=0;i<N*N;i++){
    const d=cs[i],s=side.shots[i];
    let cls='bc';
    if((showShips&&own.has(i))||sunk.has(i))cls+=' ship'+(end[i]||'');
    if(sunk.has(i))cls+=' sunk';
    if(s)cls+=' shot';
    if(i===last)cls+=' last';
    if(d.className!==cls)d.className=cls;
    const want=s===2?'h':s===1?'m':'';
    if((d.firstChild?.className||'')!==want){d.innerHTML=want?`<span class="${want}"></span>`:''}
  }
}
function paint(){
  paintBoard(mineEl,G.me,true,G.botLast);
  paintBoard(enemyEl,G.bot,false,G.myLast);
  enemyEl.classList.toggle('armed',G.phase==='battle'&&!G.busy);
  $('#fleet').innerHTML=`<span class="cap" style="color:var(--muted)">Enemy fleet</span>`+G.bot.ships.map(s=>`<div class="f ${s.hits===s.len?'gone':''}"><span class="pips">${'<i></i>'.repeat(s.len)}</span>${s.name}</div>`).join('');
  $('#enemyWrap').style.display=G.phase==='setup'?'none':'';
  $('#fleet').style.display=G.phase==='setup'?'none':'';
  $('#mineCap').textContent=G.phase==='setup'?'Your fleet · shuffle until happy':'Your fleet';
}
function fit(){
  const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;
  if(G.phase==='setup'){const s=Math.floor(Math.min(w-6,h-30,420));mineEl.style.width=mineEl.style.height=s+'px';return}
  const big=Math.floor(Math.min(w-6,(h-44)*.66,440)),small=Math.floor(Math.min(w*.5,h-big-44,220));
  enemyEl.style.width=enemyEl.style.height=big+'px';mineEl.style.width=mineEl.style.height=Math.max(110,small)+'px';
}
addEventListener('resize',()=>G&&fit());

enemyEl.addEventListener('pointerdown',async e=>{
  const d=e.target.closest('.bc');if(!d||!G||G.phase!=='battle'||G.busy)return;e.preventDefault();
  const i=+d.dataset.i;if(G.bot.shots[i])return;
  const id=G.id;G.busy=true;G.myShots++;
  const r=fire(G.bot,i);G.myLast=i;paint();
  if(navigator.vibrate)navigator.vibrate(r.hit?[20,30,40]:8);
  $('#msg').textContent=r.sunk?`You sank their ${r.sunk.name}!`:r.hit?'Hit!':'Miss.';
  if(G.bot.ships.every(s=>s.hits===s.len)){finish(true);return}
  await sleep(r.sunk?900:650);if(G.id!==id)return;
  $('#msg').textContent='Bot is aiming…';
  await sleep(450);if(G.id!==id)return;
  const j=botPick(G.me,BOT),br=fire(G.me,j);G.botLast=j;paint();
  if(br.hit&&navigator.vibrate)navigator.vibrate(60);
  const L='ABCDEFGHIJ'[Math.floor(j/N)]+(j%N+1);
  $('#msg').textContent=br.sunk?`Bot sank your ${br.sunk.name} at ${L}. Your shot.`:br.hit?`Bot hit you at ${L}. Your shot.`:`Bot missed at ${L}. Your shot.`;
  if(G.me.ships.every(s=>s.hits===s.len)){finish(false);return}
  G.busy=false;paint();
});
function finish(won){
  G.phase='over';G.busy=true;paint();
  const k=BOT+(won?'W':'L');REC[k]=(REC[k]||0)+1;store.set('sv-record',REC);
  if(!won)paintBoard(enemyEl,G.bot,true,G.myLast);
  const left=G.me.ships.filter(s=>s.hits<s.len).length;
  setTimeout(()=>{showOverlay(`<div class="stamp ${won?'good':''}">${won?'FLEET SUNK':'SUNK'}</div>
    <p>${won?`You sank all five in ${G.myShots} shots with ${left} ship${left===1?'':'s'} still afloat.`:'The bot found your last ship. Its fleet is revealed on the board.'}</p>
    <p class="stats">${RECORD_LINE()}</p>
    <div class="btns"><button class="tool" id="closeO">Look at the boards</button><button class="tool primary" id="again">New battle</button></div>`);
    $('#again').onclick=newGame;$('#closeO').onclick=hideOverlay},900);
}
function askNew(){
  if(G.phase!=='battle'){newGame();return}
  showOverlay(`<h2>New battle?</h2><p>This one will be abandoned (no loss recorded).</p>
    <div class="btns"><button class="tool" id="closeO">Keep fighting</button><button class="tool primary" id="again">New battle</button></div>`);
  $('#again').onclick=newGame;$('#closeO').onclick=hideOverlay;
}
document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{if(b.dataset.bot===BOT)return;BOT=b.dataset.bot;store.set('sv-bot',BOT);
  if(G&&G.phase==='battle'){askNew();return}newGame()});
newGame();
</script>
</body>
</html>
