<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arkade">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Four Up · Arkade</title>
<meta name="description" content="Connect four in a row against a bot or a friend.">
<meta name="theme-color" content="#f3ead8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%236f8fd0'/%3E%3Ccircle cx='13' cy='27' r='6' fill='%23d9452b'/%3E%3Ccircle cx='27' cy='27' r='6' fill='%23e8b04b'/%3E%3Ccircle cx='27' cy='13' r='6' fill='%23d9452b'/%3E%3Ccircle cx='13' cy='13' r='6' fill='%23f3ead8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--card:#fbf6ea;--ink:#1f1b16;--muted:#6b5f50;--accent:#d9582b;--yes:#5f9e4c;--no:#d9452b;--p1:#d9452b;--p2:#e8b04b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(rgba(31,27,22,.05) 1px,transparent 1px);background-size:6px 6px}
.stripe{flex:none;height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,#e8b04b 22px 44px,#7fb6a8 44px 66px,#a7c4e2 66px 88px)}
.app{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;gap:10px;
  padding:10px max(14px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
.app>*{flex:none}
header.top{display:flex;align-items:center;gap:10px;text-align:center}
header.top .ttl{flex:1;min-width:0}
header.top h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(24px,7.6vw,38px);letter-spacing:.04em;margin:0;line-height:1;white-space:nowrap}
header.top .tag{font-size:13px;margin:2px 0 0;color:var(--muted);font-style:italic}
@media (max-height:760px){header.top .tag{display:none}}
.home,.info{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);
  box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:inherit;font-weight:700;
  font-size:19px;line-height:1;color:var(--ink);text-decoration:none;padding:0;margin:0;cursor:pointer}
.home:active,.info:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.modes{display:flex;justify-content:center;gap:clamp(3px,1.2vw,6px);flex-wrap:nowrap}
.pill{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;
  padding:5px clamp(7px,2.5vw,12px);font-size:clamp(12.5px,3.7vw,14px);white-space:nowrap;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stage{flex:1 1 auto!important;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.tools{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.tool{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;
  padding:10px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.tool.primary{background:var(--ink);color:var(--card)}
.tool:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tool:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(31,27,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.hidden{display:none}
.card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:22px 18px 18px;max-width:380px;width:100%;
  text-align:center;box-shadow:8px 8px 0 var(--ink);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-size:24px;letter-spacing:.03em}
.card p{margin:12px 0 0;line-height:1.45}
.card .stats{font-weight:700;font-size:18px}
.card .btns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.card .btns .tool{padding:10px 16px}
.stamp{display:inline-block;font-family:"Archivo Black",Impact,sans-serif;font-size:32px;color:var(--accent);
  border:4px double var(--accent);padding:6px 14px;border-radius:8px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
.stamp.good{color:var(--yes);border-color:var(--yes)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.mbody{text-align:left}
.mbody h3{margin:0 0 4px;font-size:16px}
.mbody ul{padding-left:18px;margin:0 0 14px;line-height:1.45}
.mbody .rec{margin:0 0 12px;font-weight:700}

/* ===== Four Up ===== */
.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pl{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:6px 9px;
  box-shadow:2px 2px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;min-width:0;transition:background .15s,color .15s}
.pl.on{background:var(--ink);color:var(--card)}
.pl:last-child{flex-direction:row-reverse}
.pl .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}
.pl.on .dot{border-color:var(--card)}
.pl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:"Archivo Black",Impact,sans-serif;font-size:14px;text-align:center;line-height:1}
.vs small{display:block;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.msg{margin:0;text-align:center;font-weight:700;font-size:15px;min-height:1.3em}
#c4{display:block;touch-action:none;overflow:visible;cursor:pointer}
#c4 .frame{fill:#6f8fd0;stroke:var(--ink);stroke-width:6}
#c4 .disc{stroke:var(--ink);stroke-width:5}
#c4 .win{animation:glow .8s ease-in-out infinite alternate}
@keyframes glow{to{stroke:#fbf6ea;stroke-width:9}}
#c4 .ghost{opacity:.55;transition:transform .08s ease-out}
</style>
</head>
<body>
<div class="stripe"></div>
<main class="app">
  <header class="top"><a class="home" href="../" aria-label="Back to Arkade">&larr;</a><div class="ttl"><h1>FOUR UP</h1><p class="tag">four in a row. any direction.</p></div><button class="info" id="infoBtn" aria-label="How to play">?</button></header>
  <nav class="modes" aria-label="Opponent">
    <button class="pill" data-mode="easy">Easy bot</button>
    <button class="pill" data-mode="hard">Hard bot</button>
    <button class="pill" data-mode="pvp">2 players</button>
  </nav>
  <section class="players">
    <div class="pl" id="pl1"><span class="dot" style="background:var(--p1)"></span><span class="nm" id="nm1">You</span></div>
    <div class="vs"><small id="lvl">EASY</small>VS</div>
    <div class="pl" id="pl2"><span class="dot" style="background:var(--p2)"></span><span class="nm" id="nm2">Bot</span></div>
  </section>
  <p class="msg" id="msg"></p>
  <div class="stage" id="stage"><svg id="c4" viewBox="-10 -120 720 730" aria-label="Board"></svg></div>
  <section class="tools">
    <button class="tool" id="undo">Undo</button>
    <button class="tool" id="newBtn">New game</button>
  </section>
</main>
<template id="howto"><ul>
  <li>Take turns dropping discs into the 7 columns. Discs fall to the lowest open spot.</li>
  <li>Line up <b>four in a row</b> across, up and down, or diagonally to win.</li>
  <li><b>Tap</b> a column to drop. Or touch, slide to the column you want, and let go.</li>
  <li>Who goes first swaps every game. <b>Undo</b> takes back your last move (and the bot's reply).</li>
  <li>The Hard bot looks 7 moves ahead. Block its threes.</li>
</ul>
</template>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showOverlay(html){$('#card').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hideOverlay(){$('#overlay').classList.add('hidden')}
function recordLine(){return typeof RECORD_LINE==='function'?RECORD_LINE():''}
$('#infoBtn').onclick=()=>{
  const rec=recordLine();
  showOverlay(`<div class="mbody">${rec?`<p class="rec">${rec}</p>`:''}<h3>How to play</h3>${$('#howto').innerHTML}</div>
    <div class="btns"><button class="tool" id="infoClose">Got it</button></div>`);
  $('#infoClose').onclick=hideOverlay;
};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.overlay .card'))e.preventDefault()},{passive:false});

//#ENGINE
// board: 42 cells, index r*7+c with row 0 at the top. 0 empty, 1 and 2 are players.
const COLS=7,ROWS=6,ORDER=[3,2,4,1,5,0,6];
const DIRS=[[0,1],[1,0],[1,1],[1,-1]];
function lineAt(B,r,c,p){ // cells of a 4+ line through (r,c) if p sits there, else null
  for(const [dr,dc] of DIRS){
    const cells=[[r,c]];
    for(const s of [1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&B[rr*7+cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}
    if(cells.length>=4)return cells;
  }
  return null;
}
const WINDOWS=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of DIRS){
  const er=r+dr*3,ec=c+dc*3;if(er<0||er>=ROWS||ec<0||ec>=COLS)continue;
  WINDOWS.push([0,1,2,3].map(k=>(r+dr*k)*7+c+dc*k));
}
function evaluate(B,p){
  const o=3-p;let s=0;
  for(let r=0;r<ROWS;r++){const v=B[r*7+3];if(v===p)s+=3;else if(v===o)s-=3}
  for(const w of WINDOWS){
    let mine=0,theirs=0;for(const i of w){const v=B[i];if(v===p)mine++;else if(v===o)theirs++}
    if(mine&&theirs)continue;
    if(mine===3)s+=6;else if(mine===2)s+=2;
    else if(theirs===3)s-=7;else if(theirs===2)s-=2;
  }
  return s;
}
function search(B,H,depth,alpha,beta,p){
  for(const c of ORDER)if(H[c]<ROWS&&lineAt(B,ROWS-1-H[c],c,p))return 10000+depth;
  if(depth===0)return evaluate(B,p);
  let best=-Infinity,any=false;
  for(const c of ORDER){
    if(H[c]>=ROWS)continue;any=true;
    const i=(ROWS-1-H[c])*7+c;B[i]=p;H[c]++;
    const v=-search(B,H,depth-1,-beta,-alpha,3-p);
    B[i]=0;H[c]--;
    if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;
  }
  return any?best:0;
}
function bestMove(B,H,p,depth){
  const scores=[];
  for(const c of ORDER){
    if(H[c]>=ROWS)continue;
    const r=ROWS-1-H[c];
    if(lineAt(B,r,c,p))return {c,scores:[[c,1e9]]};
    const i=r*7+c;B[i]=p;H[c]++;
    const v=-search(B,H,depth-1,-Infinity,Infinity,3-p);
    B[i]=0;H[c]--;scores.push([c,v]);
  }
  const top=Math.max(...scores.map(s=>s[1])),pick=scores.filter(s=>s[1]===top);
  return {c:pick[Math.floor(Math.random()*pick.length)][0],scores};
}
//#END

// ---------- game ----------
const MODES={easy:'Easy bot',hard:'Hard bot',pvp:'2 players'};
let MODE=store.get('c4-mode','easy');if(!MODES[MODE])MODE='easy';
const REC=store.get('c4-record',{});
const RECORD_LINE=()=>`Vs Easy: ${REC.easyW||0}–${REC.easyL||0} · Vs Hard: ${REC.hardW||0}–${REC.hardL||0}${REC.draws?` · ${REC.draws} draw${REC.draws>1?'s':''}`:''}`;
let G=null,first=store.get('c4-first',1);
const svg=$('#c4'),NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e};
const names=()=>MODE==='pvp'?['Red','Yellow']:['You','Bot'];
const isBot=p=>MODE!=='pvp'&&p===2;
const colorOf=p=>p===1?'var(--p1)':'var(--p2)';

let discLayer,ghost;
function build(){
  svg.innerHTML='';
  discLayer=el('g',{});
  ghost=el('circle',{r:40,cx:350,cy:-60,class:'disc ghost',visibility:'hidden'});
  let d=`M0 0H700V600H0Z`;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=50+c*100,y=50+r*100;d+=`M${x-40} ${y}a40 40 0 1 0 80 0a40 40 0 1 0-80 0Z`}
  el('path',{d:d,class:'frame','fill-rule':'evenodd'});
  el('rect',{x:-10,y:600,width:720,height:16,rx:6,fill:'#1f1b16'});
}
function newGame(){
  hideOverlay();
  first=3-first;store.set('c4-first',first);
  G={id:(G?.id||0)+1,B:new Array(42).fill(0),H:new Array(7).fill(0),turn:first,moves:[],over:false,busy:false};
  build();
  document.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
  $('#lvl').textContent=MODE==='pvp'?'PASS':MODE.toUpperCase();
  const nm=names();$('#nm1').textContent=nm[0];$('#nm2').textContent=nm[1];
  turnStart();
}
function turnStart(){
  const nm=names();
  $('#pl1').classList.toggle('on',G.turn===1&&!G.over);$('#pl2').classList.toggle('on',G.turn===2&&!G.over);
  $('#undo').disabled=!G.moves.some(m=>!isBot(m.p))||G.busy||G.over;
  if(G.over)return;
  if(isBot(G.turn)){$('#msg').textContent='Bot is thinking…';botMove()}
  else $('#msg').textContent=MODE==='pvp'?`${nm[G.turn-1]} to drop.`:'Your move.';
}
function drop(c,p){
  const r=ROWS-1-G.H[c];
  G.B[r*7+c]=p;G.H[c]++;
  const disc=el('circle',{r:40,cx:50+c*100,cy:50+r*100,class:'disc',fill:colorOf(p)},discLayer);
  const d=(r+1)*100+60,dur=180+Math.sqrt(r+1)*90;
  disc.animate([{transform:`translateY(${-d}px)`,easing:'cubic-bezier(.5,0,1,1)'},{transform:'translateY(0)',offset:.72,easing:'ease-out'},
    {transform:'translateY(-18px)',offset:.86,easing:'ease-in'},{transform:'translateY(0)'}],{duration:dur});
  G.moves.push({c,r,p,disc});
  if(navigator.vibrate)navigator.vibrate(10);
  return {r,dur};
}
async function play(c){
  if(G.over||G.busy||G.H[c]>=ROWS)return;
  const p=G.turn,id=G.id;G.busy=true;
  const {r,dur}=drop(c,p);
  const line=lineAt(G.B,r,c,p);
  await sleep(dur);if(G.id!==id)return;
  G.busy=false;
  if(line){finish(p,line);return}
  if(G.moves.length===42){finish(0);return}
  G.turn=3-p;turnStart();
}
async function botMove(){
  const id=G.id;G.busy=true;
  await sleep(350);if(G.id!==id)return;
  const t0=performance.now();let c;
  if(MODE==='hard')c=bestMove(G.B.slice(),G.H.slice(),2,7).c;
  else{
    const {c:bc,scores}=bestMove(G.B.slice(),G.H.slice(),2,2);
    // the easy bot sometimes wanders, but never hands over a win on purpose
    const safe=scores.filter(s=>s[1]>-5000).map(s=>s[0]);
    c=Math.random()<.35&&safe.length&&scores[0][1]<1e9?safe[Math.floor(Math.random()*safe.length)]:bc;
  }
  await sleep(Math.max(0,300-(performance.now()-t0)));if(G.id!==id)return;
  G.busy=false;play(c);
}
function finish(winner,line){
  G.over=true;turnStart();const nm=names();
  if(line)for(const [r,c] of line){const m=G.moves.find(m=>m.r===r&&m.c===c);if(m)m.disc.classList.add('win')}
  let title,good;
  if(!winner){title='DRAW';good=false;$('#msg').textContent='Board full. Nobody wins.'}
  else if(MODE==='pvp'){title=`${nm[winner-1].toUpperCase()} WINS`;good=true;$('#msg').textContent=`${nm[winner-1]} connects four.`}
  else{good=winner===1;title=good?'YOU WIN':'BOT WINS';$('#msg').textContent=good?'Four in a row. Nice.':'The bot connected four.'}
  if(MODE!=='pvp'){if(!winner)REC.draws=(REC.draws||0)+1;else{const k=MODE+(winner===1?'W':'L');REC[k]=(REC[k]||0)+1}store.set('c4-record',REC)}
  setTimeout(()=>{if(!G.over)return;
    showOverlay(`<div class="stamp ${good?'good':''}">${title}</div>${MODE!=='pvp'?`<p class="stats">${RECORD_LINE()}</p>`:''}
      <div class="btns"><button class="tool" id="closeO">Look at the board</button><button class="tool primary" id="again">Rematch</button></div>`);
    $('#again').onclick=newGame;$('#closeO').onclick=hideOverlay},900);
}
function undo(){
  if(G.busy||G.over)return;
  const human=MODE==='pvp'?null:1;
  // pop back through the last human move
  while(G.moves.length){
    const m=G.moves.pop();G.B[m.r*7+m.c]=0;G.H[m.c]--;m.disc.remove();G.turn=m.p;
    if(human==null||m.p===human)break;
  }
  turnStart();
}

// ---------- input: touch, slide to a column, release to drop ----------
let aiming=null;
const colAt=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*720-10;return Math.max(0,Math.min(6,Math.floor(x/100)))};
function showGhost(c){ghost.setAttribute('fill',colorOf(G.turn));ghost.setAttribute('visibility','visible');ghost.style.transform=`translateX(${(c-3)*100}px)`}
svg.addEventListener('pointerdown',e=>{
  if(!G||G.over||G.busy||isBot(G.turn))return;e.preventDefault();
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  aiming=colAt(e);showGhost(aiming);
});
svg.addEventListener('pointermove',e=>{if(aiming==null)return;const c=colAt(e);if(c!==aiming){aiming=c;showGhost(c)}});
svg.addEventListener('pointerup',()=>{if(aiming==null)return;const c=aiming;aiming=null;ghost.setAttribute('visibility','hidden');play(c)});
svg.addEventListener('pointercancel',()=>{aiming=null;ghost.setAttribute('visibility','hidden')});
function fit(){const st=$('#stage'),w=st.clientWidth,h=st.clientHeight,k=Math.min(w/720,h/730);svg.style.width=720*k+'px';svg.style.height=730*k+'px'}
addEventListener('resize',fit);
$('#undo').onclick=undo;
$('#newBtn').onclick=()=>{
  if(!G||G.over||G.moves.length<2){newGame();return}
  showOverlay(`<h2>New game?</h2><p>This one will be thrown out${MODE!=='pvp'?' (no loss recorded)':''}.</p>
    <div class="btns"><button class="tool" id="closeO">Keep playing</button><button class="tool primary" id="again">New game</button></div>`);
  $('#again').onclick=newGame;$('#closeO').onclick=hideOverlay;
};
document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{if(b.dataset.mode===MODE)return;MODE=b.dataset.mode;store.set('c4-mode',MODE);newGame()});
newGame();fit();
</script>
</body>
</html>
