<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arkade">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Checkers · Arkade</title>
<meta name="description" content="Checkers against a bot or a friend. Captures are forced.">
<meta name="theme-color" content="#f3ead8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23f2e3c1'/%3E%3Crect x='20' y='0' width='20' height='20' fill='%233e7a66'/%3E%3Crect x='0' y='20' width='20' height='20' fill='%233e7a66'/%3E%3Ccircle cx='30' cy='10' r='7' fill='%23d9452b' stroke='%231f1b16' stroke-width='2'/%3E%3Ccircle cx='10' cy='30' r='7' fill='%231f1b16'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead8;--card:#fbf6ea;--ink:#1f1b16;--muted:#6b5f50;--accent:#d9582b;--yes:#5f9e4c;--no:#d9452b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif}
body{position:fixed;inset:0;display:flex;flex-direction:column;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background-image:radial-gradient(rgba(31,27,22,.05) 1px,transparent 1px);background-size:6px 6px}
.stripe{flex:none;height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,#e8b04b 22px 44px,#7fb6a8 44px 66px,#a7c4e2 66px 88px)}
.app{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;gap:10px;
  padding:10px max(14px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
.app>*{flex:none}
header.top{display:flex;align-items:center;gap:10px;text-align:center}
header.top .ttl{flex:1;min-width:0}
header.top h1{font-family:"Archivo Black",Impact,sans-serif;font-size:clamp(24px,7.6vw,38px);letter-spacing:.04em;margin:0;line-height:1;white-space:nowrap}
header.top .tag{font-size:13px;margin:2px 0 0;color:var(--muted);font-style:italic}
@media (max-height:760px){header.top .tag{display:none}}
.home,.info{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);
  box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:inherit;font-weight:700;
  font-size:19px;line-height:1;color:var(--ink);text-decoration:none;padding:0;margin:0;cursor:pointer}
.home:active,.info:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.modes{display:flex;justify-content:center;gap:clamp(3px,1.2vw,6px);flex-wrap:nowrap}
.pill{font:inherit;font-weight:700;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;
  padding:5px clamp(7px,2.5vw,12px);font-size:clamp(12.5px,3.7vw,14px);white-space:nowrap;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stage{flex:1 1 auto!important;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.tools{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.tool{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;
  padding:10px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.tool.primary{background:var(--ink);color:var(--card)}
.tool:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tool:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(31,27,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.overlay.hidden{display:none}
.card{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:22px 18px 18px;max-width:380px;width:100%;
  text-align:center;box-shadow:8px 8px 0 var(--ink);max-height:calc(100dvh - 32px);overflow:auto}
.card h2{margin:0;font-family:"Archivo Black",Impact,sans-serif;font-size:24px;letter-spacing:.03em}
.card p{margin:12px 0 0;line-height:1.45}
.card .stats{font-weight:700;font-size:18px}
.card .btns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.card .btns .tool{padding:10px 16px}
.stamp{display:inline-block;font-family:"Archivo Black",Impact,sans-serif;font-size:32px;color:var(--accent);
  border:4px double var(--accent);padding:6px 14px;border-radius:8px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
.stamp.good{color:var(--yes);border-color:var(--yes)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.mbody{text-align:left}
.mbody h3{margin:0 0 4px;font-size:16px}
.mbody ul{padding-left:18px;margin:0 0 14px;line-height:1.45}
.mbody .rec{margin:0 0 12px;font-weight:700}

/* ===== Checkers ===== */
.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pl{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:6px 9px;
  box-shadow:2px 2px 0 var(--ink);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;min-width:0;transition:background .15s,color .15s}
.pl.on{background:var(--ink);color:var(--card)}
.pl:last-child{flex-direction:row-reverse}
.pl .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);flex:none}
.pl.on .dot{border-color:var(--card)}
.pl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pl .cnt{font-variant-numeric:tabular-nums}
.vs{font-family:"Archivo Black",Impact,sans-serif;font-size:14px;text-align:center;line-height:1}
.vs small{display:block;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--muted)}
.msg{margin:0;text-align:center;font-weight:700;font-size:15px;min-height:1.3em}
#board{position:relative;border:5px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;touch-action:manipulation;background:#f2e3c1}
.sq{position:absolute}
.sq.d{background:#3e7a66}
.sq.from{background:#5f9e4c}
.sq.lastmv{background:#56907b}
.dest{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.dest::after{content:"";width:34%;height:34%;border-radius:50%;background:#fbf6ea;opacity:.85;box-shadow:0 0 0 3px rgba(31,27,22,.35);animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.pc{position:absolute;left:0;top:0;border-radius:50%;z-index:2;will-change:transform;transition:transform .22s ease-in-out,opacity .25s;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.pc::before{content:"";position:absolute;inset:7%;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.pc.r::before{background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(0,0,0,.14) 43% 48%,transparent 49%),#d9452b}
.pc.b::before{background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(255,255,255,.14) 43% 48%,transparent 49%),#2e2924;border-color:#0e0c0a}
.pc svg{position:relative;width:46%;height:46%;margin-top:-4%}
.pc.sel{z-index:4}.pc.sel::before{box-shadow:0 0 0 4px #e8b04b,0 4px 0 var(--ink)}
.pc.can::before{box-shadow:0 0 0 3px rgba(232,176,75,.85),0 4px 0 var(--ink)}
.pc.gone{opacity:0}
.pc.crown svg{animation:crown .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes crown{from{transform:scale(0) rotate(-30deg)}}
</style>
</head>
<body>
<div class="stripe"></div>
<main class="app">
  <header class="top"><a class="home" href="../" aria-label="Back to Arkade">&larr;</a><div class="ttl"><h1>CHECKERS</h1><p class="tag">jump or be jumped.</p></div><button class="info" id="infoBtn" aria-label="How to play">?</button></header>
  <nav class="modes" aria-label="Opponent">
    <button class="pill" data-mode="easy">Easy bot</button>
    <button class="pill" data-mode="hard">Hard bot</button>
    <button class="pill" data-mode="pvp">2 players</button>
  </nav>
  <section class="players">
    <div class="pl" id="plr"><span class="dot" style="background:#d9452b"></span><span class="nm" id="nmr">You</span><span class="cnt" id="cr">12</span></div>
    <div class="vs"><small id="lvl">EASY</small>VS</div>
    <div class="pl" id="plb"><span class="dot" style="background:#2e2924"></span><span class="nm" id="nmb">Bot</span><span class="cnt" id="cb">12</span></div>
  </section>
  <p class="msg" id="msg"></p>
  <div class="stage" id="stage"><div id="board"></div></div>
  <section class="tools">
    <button class="tool" id="undo">Undo</button>
    <button class="tool" id="newBtn">New game</button>
  </section>
</main>
<template id="howto"><ul>
  <li>Pieces move one square diagonally forward onto the dark squares. Red moves first, up the board.</li>
  <li><b>Jump</b> an enemy piece by hopping over it to an empty square behind. If you can jump, you <b>must</b>. Keep jumping in one turn if another jump is open.</li>
  <li>Reach the far row and your piece is <b>crowned</b>. Kings move and jump backwards too. Crowning ends the turn.</li>
  <li>Tap a piece, then tap a glowing dot. Pieces that can move glow when a jump is forced.</li>
  <li>Win by taking every enemy piece or leaving them with no moves. 40 moves each with no capture or man moved is a draw.</li>
</ul>
</template>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showOverlay(html){$('#card').innerHTML=html;$('#overlay').classList.remove('hidden')}
function hideOverlay(){$('#overlay').classList.add('hidden')}
function recordLine(){return typeof RECORD_LINE==='function'?RECORD_LINE():''}
$('#infoBtn').onclick=()=>{
  const rec=recordLine();
  showOverlay(`<div class="mbody">${rec?`<p class="rec">${rec}</p>`:''}<h3>How to play</h3>${$('#howto').innerHTML}</div>
    <div class="btns"><button class="tool" id="infoClose">Got it</button></div>`);
  $('#infoClose').onclick=hideOverlay;
};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.overlay .card'))e.preventDefault()},{passive:false});

//#ENGINE
// squares 0..63 (r*8+c, row 0 at the top). 1 red man, 2 red king (red plays up), -1/-2 black.
const initial=()=>{const B=new Array(64).fill(0);for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)B[r*8+c]=-1;else if(r>4)B[r*8+c]=1}return B};
const DIAG=[[-1,-1],[-1,1],[1,-1],[1,1]];
const dirsOf=p=>Math.abs(p)===2?DIAG:p>0?DIAG.slice(0,2):DIAG.slice(2);
function genMoves(B,side){
  const jumps=[],steps=[];
  for(let s=0;s<64;s++){
    const p=B[s];if(!p||Math.sign(p)!==side)continue;
    const r=s>>3,c=s&7;
    B[s]=0;
    (function hop(r,c,path,caps){
      let more=false;
      for(const [dr,dc] of dirsOf(p)){
        const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;
        if(lr<0||lr>7||lc<0||lc>7)continue;
        const m=mr*8+mc,l=lr*8+lc;
        if(Math.sign(B[m])!==-side||caps.includes(m)||B[l])continue;
        more=true;
        const crowned=Math.abs(p)===1&&(side>0?lr===0:lr===7);
        if(crowned)jumps.push({path:[...path,l],caps:[...caps,m]});
        else hop(lr,lc,[...path,l],[...caps,m]);
      }
      if(!more&&caps.length)jumps.push({path,caps});
    })(r,c,[s],[]);
    B[s]=p;
    if(!jumps.length)for(const [dr,dc] of dirsOf(p)){const R=r+dr,C=c+dc;if(R>=0&&R<8&&C>=0&&C<8&&!B[R*8+C])steps.push({path:[s,R*8+C],caps:[]})}
  }
  return jumps.length?jumps:steps;
}
function applyMove(B,m){
  const from=m.path[0],to=m.path[m.path.length-1];let p=B[from];
  B[from]=0;for(const c of m.caps)B[c]=0;
  if(Math.abs(p)===1&&(p>0?to<8:to>=56))p*=2;
  B[to]=p;return B;
}
const PST=[...Array(64)].map((_,s)=>{const r=s>>3,c=s&7;return (c>=2&&c<=5&&r>=2&&r<=5?4:0)+(c===0||c===7?-2:0)});
function evaluate(B,side){
  let s=0;
  for(let i=0;i<64;i++){
    const p=B[i];if(!p)continue;
    const r=i>>3,sg=Math.sign(p);
    let v=Math.abs(p)===2?165:100+(p>0?(7-r):r)*3+((p>0?r===7:r===0)?8:0); // men gain a little as they advance; back row guards
    v+=PST[i];
    s+=sg*v;
  }
  return s*side;
}
function search(B,side,depth,alpha,beta,ext){
  const ms=genMoves(B,side);
  if(!ms.length)return -100000-depth;
  const capture=ms[0].caps.length>0;
  if(depth<=0&&!(capture&&ext<6))return evaluate(B,side);
  let best=-Infinity;
  for(const m of ms){
    const saved=B.slice();applyMove(B,m);
    const v=-search(B,-side,depth-1+(depth<=0?1:0),-beta,-alpha,ext+(depth<=0?1:0));
    for(let i=0;i<64;i++)B[i]=saved[i];
    if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;
  }
  return best;
}
function bestMove(B,side,depth,noise){
  const ms=genMoves(B,side);if(ms.length===1)return ms[0];
  let best=-Infinity,pick=[];
  for(const m of ms){
    const b=applyMove(B.slice(),m);
    const v=-search(b,-side,depth-1,-Infinity,Infinity,0)+(noise?(Math.random()-.5)*noise:0);
    if(v>best+1e-9){best=v;pick=[m]}else if(Math.abs(v-best)<1e-9)pick.push(m);
  }
  return pick[Math.floor(Math.random()*pick.length)];
}
//#END

const MODES={easy:'Easy bot',hard:'Hard bot',pvp:'2 players'};
let MODE=store.get('ck-mode','easy');if(!MODES[MODE])MODE='easy';
const REC=store.get('ck-record',{});
const RECORD_LINE=()=>`Vs Easy: ${REC.easyW||0}–${REC.easyL||0} · Vs Hard: ${REC.hardW||0}–${REC.hardL||0}${REC.draws?` · ${REC.draws} draw${REC.draws>1?'s':''}`:''}`;
const CROWN='<svg viewBox="0 0 24 24"><path d="M3 18 L4 8 L9 12 L12 5 L15 12 L20 8 L21 18Z" fill="#e8b04b" stroke="#1f1b16" stroke-width="2" stroke-linejoin="round"/></svg>';
let G=null,cs=0,els={},sel=null,prefix=[];
const boardEl=$('#board');
const names=()=>MODE==='pvp'?['Red','Black']:['You','Bot'];
const isBot=side=>MODE!=='pvp'&&side===-1;

function newGame(){
  hideOverlay();
  G={id:(G?.id||0)+1,B:initial(),side:1,hist:[],quiet:0,over:false,busy:false,last:null};
  sel=null;prefix=[];
  document.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===MODE));
  $('#lvl').textContent=MODE==='pvp'?'PASS':MODE.toUpperCase();
  const nm=names();$('#nmr').textContent=nm[0];$('#nmb').textContent=nm[1];
  fit();turnStart();
}
function fit(){
  const st=$('#stage'),s=Math.floor(Math.min(st.clientWidth-12,st.clientHeight-12,520)/8)*8;
  cs=(s)/8;boardEl.style.width=boardEl.style.height=s+10+'px';
  if(G)build();
}
const xy=s=>`translate(${(s&7)*cs}px,${(s>>3)*cs}px)`;
function build(){
  boardEl.innerHTML='';els={};
  for(let s=0;s<64;s++){const d=document.createElement('div');d.className='sq'+(((s>>3)+(s&7))%2?' d':'');d.dataset.s=s;
    Object.assign(d.style,{width:cs+'px',height:cs+'px',left:(s&7)*cs+'px',top:(s>>3)*cs+'px'});boardEl.appendChild(d)}
  for(let s=0;s<64;s++)if(G.B[s])els[s]=pieceEl(s,G.B[s]);
  decorate();
}
function pieceEl(s,p){
  const d=document.createElement('div');d.className='pc '+(p>0?'r':'b');d.style.width=d.style.height=cs+'px';
  d.style.transition='none';d.style.transform=xy(s);if(Math.abs(p)===2)d.innerHTML=CROWN;
  boardEl.appendChild(d);void d.offsetWidth;d.style.transition='';return d;
}
function decorate(){
  boardEl.querySelectorAll('.dest').forEach(d=>d.remove());
  boardEl.querySelectorAll('.sq').forEach(q=>{const s=+q.dataset.s;q.classList.toggle('from',sel!=null&&s===(prefix[prefix.length-1]??sel));
    q.classList.toggle('lastmv',!!G.last&&G.last.includes(s)&&!(sel!=null&&s===sel))});
  for(const s in els)els[s].classList.remove('sel','can');
  if(G.over||G.busy||isBot(G.side))return;
  const ms=genMoves(G.B,G.side);
  if(sel==null){if(ms[0]?.caps.length)for(const m of ms)els[m.path[0]]?.classList.add('can');return}
  els[sel]?.classList.add('sel');
  const n=prefix.length,next=new Set();
  for(const m of ms)if(m.path[0]===sel&&prefix.every((q,k)=>m.path[k]===q)&&m.path.length>n)next.add(m.path[n]);
  for(const s of next){const d=document.createElement('div');d.className='dest';d.dataset.s=s;
    Object.assign(d.style,{width:cs+'px',height:cs+'px',left:(s&7)*cs+'px',top:(s>>3)*cs+'px'});boardEl.appendChild(d)}
}
function counts(){let r=0,b=0;for(const p of G.B){if(p>0)r++;else if(p<0)b++}$('#cr').textContent=r;$('#cb').textContent=b}
function turnStart(){
  const nm=names();counts();
  $('#plr').classList.toggle('on',G.side===1&&!G.over);$('#plb').classList.toggle('on',G.side===-1&&!G.over);
  $('#undo').disabled=G.busy||!G.hist.some(h=>!isBot(h.side));
  if(G.over){decorate();return}
  const ms=genMoves(G.B,G.side);
  if(!ms.length){finish(-G.side,'no moves left');return}
  if(G.quiet>=80){finish(0,'40 moves each without a capture');return}
  const forced=ms[0].caps.length;
  if(isBot(G.side)){$('#msg').textContent='Bot is thinking…';decorate();botTurn();return}
  $('#msg').textContent=(MODE==='pvp'?`${nm[G.side>0?0:1]}'s move.`:'Your move.')+(forced?' You must jump.':'');
  decorate();
}
async function animate(m){
  const id=G.id,from=m.path[0];let el=els[from];delete els[from];
  el.classList.add('sel');
  for(let k=1;k<m.path.length;k++){
    const to=m.path[k];el.style.transform=xy(to);
    if(navigator.vibrate)navigator.vibrate(m.caps.length?25:8);
    await sleep(230);if(G.id!==id)return false;
    if(m.caps[k-1]!=null){const c=m.caps[k-1],ce=els[c];delete els[c];if(ce){ce.classList.add('gone');setTimeout(()=>ce.remove(),260)}}
  }
  el.classList.remove('sel');els[m.path[m.path.length-1]]=el;return true;
}
async function commit(m){
  const was=G.B[m.path[0]];G.busy=true;sel=null;prefix=[];decorate();
  G.hist.push({B:G.B.slice(),side:G.side,quiet:G.quiet,last:G.last});
  const ok=await animate(m);if(!ok)return;
  applyMove(G.B,m);
  const to=m.path[m.path.length-1];
  if(G.B[to]!==was){els[to].innerHTML=CROWN;els[to].classList.add('crown')}
  G.quiet=m.caps.length||Math.abs(was)===1?0:G.quiet+1;
  G.last=[m.path[0],to];G.side=-G.side;G.busy=false;
  turnStart();
}
async function botTurn(){
  const id=G.id;G.busy=true;
  await sleep(380);if(G.id!==id)return;
  const t0=performance.now();
  const m=MODE==='hard'?bestMove(G.B.slice(),-1,6,0):bestMove(G.B.slice(),-1,2,70);
  await sleep(Math.max(0,250-(performance.now()-t0)));if(G.id!==id)return;
  G.busy=false;commit(m);
}
boardEl.addEventListener('pointerdown',e=>{
  if(!G||G.over||G.busy||isBot(G.side))return;e.preventDefault();
  const r=boardEl.getBoundingClientRect(),c=Math.floor((e.clientX-r.left-5)/cs),rr=Math.floor((e.clientY-r.top-5)/cs);
  if(c<0||c>7||rr<0||rr>7)return;const s=rr*8+c;
  const ms=genMoves(G.B,G.side);
  const dest=e.target.closest('.dest');
  if(dest&&sel!=null){
    prefix.push(+dest.dataset.s);
    const done=ms.find(m=>m.path.length===prefix.length&&m.path.every((q,k)=>q===prefix[k]));
    if(done){commit(done);return}
    // partial multi-jump: hop the piece now, finish on the next tap
    const el=els[sel];if(el)el.style.transform=xy(prefix[prefix.length-1]);
    const mm=ms.find(m=>prefix.every((q,k)=>m.path[k]===q));const cap=mm.caps[prefix.length-2];
    if(els[cap]){els[cap].style.opacity=.35}
    if(navigator.vibrate)navigator.vibrate(25);
    $('#msg').textContent='Keep jumping.';decorate();return;
  }
  if(prefix.length>1)return; // mid multi-jump: must finish it
  if(Math.sign(G.B[s])===G.side&&ms.some(m=>m.path[0]===s)){sel=s;prefix=[s];decorate();return}
  if(Math.sign(G.B[s])===G.side){$('#msg').textContent=ms[0]?.caps.length?'A jump is forced: pick a glowing piece.':'That piece is stuck.'}
  sel=null;prefix=[];decorate();
});
function finish(winner,why){
  G.over=true;const nm=names();
  let title,good=false;
  if(winner===0){title='DRAW'}
  else if(MODE==='pvp'){title=`${nm[winner>0?0:1].toUpperCase()} WINS`;good=true}
  else{good=winner>0;title=good?'YOU WIN':'BOT WINS'}
  if(MODE!=='pvp'){if(!winner)REC.draws=(REC.draws||0)+1;else{const k=MODE+(winner>0?'W':'L');REC[k]=(REC[k]||0)+1}store.set('ck-record',REC)}
  const loser=winner>0?nm[1]:nm[0];
  $('#msg').textContent=winner?`${loser} ${loser==='You'?'have':'has'} ${why}.`:`Draw: ${why}.`;
  turnStart();
  setTimeout(()=>{if(!G.over)return;showOverlay(`<div class="stamp ${good?'good':''}">${title}</div><p>${$('#msg').textContent}</p>${MODE!=='pvp'?`<p class="stats">${RECORD_LINE()}</p>`:''}
    <div class="btns"><button class="tool" id="closeO">Look at the board</button><button class="tool primary" id="again">Rematch</button></div>`);
    $('#again').onclick=newGame;$('#closeO').onclick=hideOverlay},700);
}
$('#undo').onclick=()=>{
  if(G.busy||!G.hist.length)return;
  let h;do{h=G.hist.pop()}while(G.hist.length&&isBot(h.side));
  if(isBot(h.side))return;
  G.B=h.B;G.side=h.side;G.quiet=h.quiet;G.last=h.last;G.over=false;sel=null;prefix=[];build();turnStart();
};
$('#newBtn').onclick=()=>{
  if(!G||G.over||G.hist.length<2){newGame();return}
  showOverlay(`<h2>New game?</h2><p>This one will be thrown out${MODE!=='pvp'?' (no loss recorded)':''}.</p>
    <div class="btns"><button class="tool" id="closeO">Keep playing</button><button class="tool primary" id="again">New game</button></div>`);
  $('#again').onclick=newGame;$('#closeO').onclick=hideOverlay;
};
document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{if(b.dataset.mode===MODE)return;MODE=b.dataset.mode;store.set('ck-mode',MODE);newGame()});
addEventListener('resize',()=>G&&fit());
newGame();
</script>
